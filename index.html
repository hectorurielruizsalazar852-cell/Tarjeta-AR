
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi tarjeta AR</title> <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body> <a-scene mindar-image="imageTargetSrc: ./targets.mind" color-space="sRGB" renderer="colorManagement: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"> <!-- VIDEO --> <a-assets> <video
                id="miVideo"
    src="./video.mp4"
    preload="auto"
    loop
    playsinline> </video> </a-assets>
        <!-- CÁMARA --> <a-camera position="0 0 0" look-controls="enabled: false"> </a-camera> <!-- TARJETA -->
        <a-entity id="tarjeta" mindar-image-target="targetIndex: 0"> <!-- VIDEO QUE APARECE SOBRE LA TARJETA -->
            <a-video src="#miVideo" position="0 0 0" width="1" height="0.5625"> </a-video> </a-entity> </a-scene>
    <!-- JAVASCRIPT -->
   <script>

    const video = document.querySelector("#miVideo");
    const tarjeta = document.querySelector("#tarjeta");

    tarjeta.addEventListener("targetFound", async function () {

        console.log("TARJETA ENCONTRADA");

        try {

            await video.play();

            console.log("VIDEO REPRODUCIENDO");

        } catch (error) {

            console.log("NO SE PUDO REPRODUCIR:");
            console.log(error);

        }

    });


    tarjeta.addEventListener("targetLost", function () {

        console.log("TARJETA PERDIDA");

        video.pause();

    });

    video.load();

video.addEventListener("canplay", function () {
    console.log("Video listo para reproducirse");

    let temporizador;

tarjeta.addEventListener("targetFound", function () {

    clearTimeout(temporizador);

    video.play();

});

tarjeta.addEventListener("targetLost", function () {

    temporizador = setTimeout(function () {

        video.pause();

    }, 500);

});
});

</script>
</body>

</html>
