
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi tarjeta AR</title> <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind" color-space="sRGB" renderer="colorManagement: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"> <!-- VIDEO --> <a-assets> <video
                id="miVideo"
    src="./video.mp4"
    preload="auto"
    loop
    playsinline> </video> </a-assets>
        <!-- CÁMARA --> <a-camera position="0 0 0" look-controls="enabled: false"> </a-camera> <!-- TARJETA -->
        <a-entity id="tarjeta" mindar-image-target="targetIndex: 0"> <!-- VIDEO QUE APARECE SOBRE LA TARJETA -->
            <a-video src="#miVideo" position="0 0 0" width="1" height="0.5625"> </a-video> </a-entity> </a-scene>
    <!-- JAVASCRIPT -->
   <script>
    const video = document.querySelector("#miVideo");
    const tarjeta = document.querySelector("#tarjeta");
    const escena = document.querySelector("a-scene");
    const panel = document.querySelector("#diagnostico");

    function mostrar(mensaje) {
        panel.innerHTML += "<br>" + mensaje;
        console.log(mensaje);
    }

    mostrar("JavaScript iniciado");

    // Detectar errores generales
    window.addEventListener("error", function(event) {
        mostrar("ERROR: " + event.message);
    });

    // Detectar errores de promesas
    window.addEventListener("unhandledrejection", function(event) {
        mostrar("ERROR DE PROMESA: " + event.reason);
    });

    // A-Frame
    escena.addEventListener("loaded", function() {
        mostrar("A-FRAME: escena cargada");
    });

    escena.addEventListener("renderstart", function() {
        mostrar("A-FRAME: render iniciado");
    });

    // MindAR
    escena.addEventListener("arReady", function() {
        mostrar("MINDAR: cámara y AR iniciados");
    });

    escena.addEventListener("arError", function(event) {
        mostrar("MINDAR: error al iniciar");
        console.error(event);
    });

    // Video
    video.addEventListener("canplay", function() {
        mostrar("VIDEO: listo");
    });

    video.addEventListener("error", function() {
        mostrar("VIDEO: error al cargar");
    });

    // Reconocimiento de tarjeta
    tarjeta.addEventListener("targetFound", async function() {
        mostrar("TARJETA ENCONTRADA");

        try {
            await video.play();
        } catch(error) {
            mostrar("ERROR VIDEO: " + error.message);
        }
    });

    tarjeta.addEventListener("targetLost", function() {
        video.pause();
        mostrar("TARJETA PERDIDA");
    });
</script>
</body>

</html>
