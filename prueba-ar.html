<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagnóstico A-Frame</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            background: white;
            font-family: Arial;
        }

        a-scene {
            width: 100%;
            height: 80vh;
        }
    </style>
</head>

<body>

    <h2>Prueba A-Frame</h2>

    <a-scene
        renderer="antialias: false; alpha: false"
        background="color: #222222">

        <a-box
            position="0 1 -3"
            color="red"
            rotation="0 45 0">
        </a-box>

        <a-camera position="0 1.6 0"></a-camera>

    </a-scene>
